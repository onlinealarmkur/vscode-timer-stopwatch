name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ -z "$DEFAULT_BRANCH" ]]; then
            echo "Repository default branch is unavailable." >&2
            exit 1
          fi

          readonly default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git show-ref --verify --quiet "$default_ref"; then
            echo "Checked-out default branch ref is unavailable: $default_ref" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "${GITHUB_SHA}^{commit}" >/dev/null; then
            echo "Tagged commit cannot be resolved: $GITHUB_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$default_ref"; then
            echo "Tagged commit $GITHUB_SHA is not on $DEFAULT_BRANCH." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "Release tags must be annotated." >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail

          readonly package_version="$(node -p "require('./package.json').version")"
          readonly lock_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [[ "$GITHUB_REF_NAME" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "$lock_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package-lock.json version $lock_version." >&2
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Audit high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Run checks and production build
        run: npm run check
      - name: Run coverage suite
        run: npm run test:coverage
      - name: Run Extension Host integration test
        run: xvfb-run -a npm run test:integration
        timeout-minutes: 10
      - name: Package VSIX
        run: npm run package:vsix
      - name: Verify exact VSIX contents
        shell: bash
        run: |
          set -euo pipefail

          readonly vsix="timer-stopwatch-${GITHUB_REF_NAME}.vsix"
          if [[ ! -f "$vsix" || -L "$vsix" ]]; then
            echo "Expected one regular VSIX file: $vsix" >&2
            exit 1
          fi
          unzip -tqq "$vsix"

          readonly expected="$({
            printf '%s\n' '[Content_Types].xml'
            printf '%s\n' 'extension.vsixmanifest'
            printf '%s\n' 'extension/LICENSE.txt'
            printf '%s\n' 'extension/dist/extension.js'
            printf '%s\n' 'extension/package.json'
            printf '%s\n' 'extension/readme.md'
            printf '%s\n' 'extension/resources/icon.png'
          } | LC_ALL=C sort)"
          readonly actual="$(unzip -Z1 "$vsix" | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "VSIX contents differ from the release allowlist." >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
      - name: Install the exact VSIX
        shell: bash
        run: |
          set -euo pipefail

          readonly vsix="timer-stopwatch-${GITHUB_REF_NAME}.vsix"
          readonly code_path="$(find .vscode-test -type f -path '*/bin/code' -print -quit)"
          readonly extensions_directory="$RUNNER_TEMP/timer-extensions"
          readonly user_data_directory="$RUNNER_TEMP/timer-user-data"
          if [[ -z "$code_path" || ! -x "$code_path" ]]; then
            echo "The tested VS Code executable is unavailable." >&2
            exit 1
          fi

          "$code_path" \
            --user-data-dir "$user_data_directory" \
            --extensions-dir "$extensions_directory" \
            --install-extension "$vsix" \
            --force
          if ! "$code_path" \
            --user-data-dir "$user_data_directory" \
            --extensions-dir "$extensions_directory" \
            --list-extensions \
            --show-versions | grep -Fxq "ozdemir.timer-stopwatch@${GITHUB_REF_NAME}"; then
            echo "The exact VSIX was not installed as ozdemir.timer-stopwatch@${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - name: Attest VSIX provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: timer-stopwatch-${{ github.ref_name }}.vsix
      - name: Upload verified VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timer-stopwatch-release-vsix
          path: timer-stopwatch-${{ github.ref_name }}.vsix
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timer-stopwatch-release-vsix
          path: release-vsix
      - name: Verify downloaded workflow artifact
        shell: bash
        run: |
          set -euo pipefail

          readonly expected="timer-stopwatch-${GITHUB_REF_NAME}.vsix"
          readonly actual="$(find release-vsix -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected workflow artifact contents." >&2
            exit 1
          fi
          if [[ ! -f "release-vsix/$expected" || -L "release-vsix/$expected" ]]; then
            echo "Workflow artifact is not one regular VSIX file." >&2
            exit 1
          fi
          unzip -tqq "release-vsix/$expected"
      - name: Publish complete verified GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          readonly tag="$GITHUB_REF_NAME"
          readonly repository="$GH_REPO"
          readonly repository_owner="${repository%%/*}"
          readonly repository_name="${repository#*/}"
          readonly asset_name="timer-stopwatch-${tag}.vsix"
          readonly asset_path="release-vsix/${asset_name}"
          expected_assets_json="$(jq -cn --arg name "$asset_name" '[$name]')"
          readonly expected_assets_json
          temporary_directory="$(mktemp -d)"
          readonly temporary_directory
          readonly release_state_file="$temporary_directory/release-state.json"
          readonly remote_assets_file="$temporary_directory/remote-assets.json"
          trap 'rm -rf -- "$temporary_directory"' EXIT

          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $tag" >&2
            exit 1
          fi
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Unexpected repository identifier: $repository" >&2
            exit 1
          fi
          if [[ ! -f "$asset_path" || -L "$asset_path" ]]; then
            echo "Expected release asset is unavailable: $asset_path" >&2
            exit 1
          fi

          query_release() {
            gh api graphql \
              -f "owner=$repository_owner" \
              -f "name=$repository_name" \
              -f "tagName=$tag" \
              -f query='
                query($owner: String!, $name: String!, $tagName: String!) {
                  repository(owner: $owner, name: $name) {
                    release(tagName: $tagName) {
                      databaseId
                      isDraft
                    }
                  }
                }
              ' >"$release_state_file"
            jq -e '.data.repository != null' "$release_state_file" >/dev/null
          }

          require_release_id() {
            local release_id
            release_id="$(jq -r '.data.repository.release.databaseId // empty' "$release_state_file")"
            if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
              echo "Release database ID is unavailable or invalid." >&2
              exit 1
            fi
            printf '%s\n' "$release_id"
          }

          assert_same_draft() {
            local expected_release_id="$1"
            local actual_release_id
            query_release
            actual_release_id="$(require_release_id)"
            if [[ "$actual_release_id" != "$expected_release_id" ]]; then
              echo "Release identity changed while publishing." >&2
              exit 1
            fi
            if ! jq -e '.data.repository.release.isDraft == true' "$release_state_file" >/dev/null; then
              echo "Refusing to upload to a published release." >&2
              exit 1
            fi
          }

          query_assets() {
            local release_id="$1"
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              "repos/${repository}/releases/${release_id}/assets?per_page=100" \
              >"$remote_assets_file"
            if ! jq -e '
              type == "array"
              and all(.[]; type == "array")
              and all(.[][]; (.id | type == "number") and (.name | type == "string"))
            ' "$remote_assets_file" >/dev/null; then
              echo "GitHub returned an invalid release asset list." >&2
              exit 1
            fi
          }

          download_and_compare_asset() {
            local asset_id
            local remote_path="$temporary_directory/remote-$asset_name"
            asset_id="$(
              jq -r --arg name "$asset_name" \
                '.[][] | select(.name == $name) | .id' \
                "$remote_assets_file"
            )"
            if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
              echo "Remote asset ID is unavailable or invalid for $asset_name." >&2
              exit 1
            fi
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/${repository}/releases/assets/${asset_id}" \
              >"$remote_path"
            if ! cmp --silent -- "$asset_path" "$remote_path"; then
              echo "Remote draft asset differs from the built VSIX." >&2
              exit 1
            fi
          }

          query_release
          if jq -e '.data.repository.release == null' "$release_state_file" >/dev/null; then
            gh release create "$tag" \
              --repo "$repository" \
              --draft \
              --verify-tag \
              --title "$tag" \
              --generate-notes
            query_release
          fi
          if ! jq -e '.data.repository.release.isDraft == true' "$release_state_file" >/dev/null; then
            echo "Refusing to modify an existing published release." >&2
            exit 1
          fi
          target_release_id="$(require_release_id)"
          readonly target_release_id

          query_assets "$target_release_id"
          if ! jq -e --argjson expected "$expected_assets_json" '
            [ .[][] | .name ] as $names
            | ($names | length) == ($names | unique | length)
              and all($names[]; . as $name | $expected | index($name) != null)
          ' "$remote_assets_file" >/dev/null; then
            echo "Draft contains an unexpected or duplicate release asset." >&2
            exit 1
          fi

          match_count="$(
            jq --arg name "$asset_name" \
              '[ .[][] | select(.name == $name) ] | length' \
              "$remote_assets_file"
          )"
          case "$match_count" in
            0)
              assert_same_draft "$target_release_id"
              gh release upload "$tag" \
                --repo "$repository" \
                "$asset_path"
              query_assets "$target_release_id"
              ;;
            1)
              download_and_compare_asset
              ;;
            *)
              echo "Draft contains duplicate assets named $asset_name." >&2
              exit 1
              ;;
          esac

          query_assets "$target_release_id"
          if ! jq -e --argjson expected "$expected_assets_json" '
            ([ .[][] | .name ] | sort) == ($expected | sort)
            and all(.[][]; .state == "uploaded")
          ' "$remote_assets_file" >/dev/null; then
            echo "Draft release assets are missing, duplicated, unexpected, or incomplete." >&2
            exit 1
          fi
          download_and_compare_asset

          assert_same_draft "$target_release_id"
          gh release edit "$tag" \
            --repo "$repository" \
            --draft=false
          query_release
          if ! jq -e \
            --argjson releaseId "$target_release_id" \
            '.data.repository.release.databaseId == $releaseId
              and .data.repository.release.isDraft == false' \
            "$release_state_file" >/dev/null; then
            echo "Published release state could not be verified." >&2
            exit 1
          fi
