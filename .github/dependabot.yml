version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      development-dependencies:
        dependency-type: "development"
    ignore:
      # Update API types together with engines.vscode and the integration baseline.
      - dependency-name: "@types/vscode"
      # Match the Node major embedded in the minimum supported VS Code release.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
